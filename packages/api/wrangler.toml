# Worker de l'API du socle AIMMO (S09).
# Il vit à côté des systèmes de shawez-immo sans les toucher : son propre nom, aucune route sur shawez-immo.com,
# seulement l'adresse workers.dev du compte. Aucune clé ici : API_KEYS est un secret Cloudflare.
name = "aimmo-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# Seul mode admis tant qu'aucune tâche du plan n'a mis d'envoi réel en service.
MODE = "essai"

[[d1_databases]]
binding = "DB"
database_name = "aimmo"
# Rempli au déploiement par .github/workflows/deployer-api.yml, qui crée la base en Europe si elle manque.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../db/migrations"

[triggers]
# Un seul déclencheur, chaque minute (BR65) : le passage des notifications aux agents (HX27) passe à chaque minute ; aux
# minutes 0, 15, 30 et 45 seulement, le planificateur du socle (B02) passe les tâches dues à l'heure de Paris, une fois
# par heure, et celles qui ont leur minute (le plan du jour à 7 h 30, G02), et le passage de publication des annonces
# (P10) passe une fois par quart d'heure.
crons = ["* * * * *"]

[observability]
enabled = true

# AU025 : le bac à sable du premier parcours, une base SQLite à part par agent (objet durable), jamais la base du réseau.
[[durable_objects.bindings]]
name = "BAC_A_SABLE"
class_name = "BacASableBase"

[[migrations]]
tag = "v1-bac-a-sable"
new_sqlite_classes = ["BacASableBase"]
