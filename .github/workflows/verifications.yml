name: Vérifications

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'chantier/**'

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest
    # Marge d'au moins 30 % sur la durée mesurée (X28) : `scripts/controle-verifications.mjs` y veille.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Les contrôles courts d'abord : une coupure pendant les tests ne les saute plus.
      - name: Garde-fous
        run: npm run garde-fous
      - name: Paquet du Worker
        working-directory: packages/api
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx -y wrangler@4.149.0 deploy --dry-run --outdir "$RUNNER_TEMP/aimmo-api"
      - name: Types
        run: npm run check
      - name: Tests
        run: npm test
